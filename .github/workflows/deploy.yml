name: Build & Deploy to Cloud Run

# Trigger: workflow ini jalan otomatis setiap kamu push ke branch "main"
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest   # Pakai mesin virtual Ubuntu di server GitHub

    steps:
      # 1. Checkout: ambil kode dari repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login ke GCP pakai JSON key yang disimpan di Secrets
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # 3. Install gcloud CLI di mesin GitHub
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # 4. Konfigurasi Docker supaya bisa push ke Artifact Registry GCP
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      # 5. Build Docker image dan push ke Artifact Registry
      #    Tag image pakai GITHUB_SHA (hash commit) supaya unik tiap deploy
      - name: Build & Push Docker image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/prisma-todolist"
          docker build -t $IMAGE:$GITHUB_SHA .
          docker push $IMAGE:$GITHUB_SHA

      # 6. Deploy image ke Cloud Run
      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/prisma-todolist"
          gcloud run deploy prisma-todolist-service \
            --image=$IMAGE:$GITHUB_SHA \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}"

      # 7. Tampilkan URL aplikasi yang sudah live
      - name: Show deployed URL
        run: |
          gcloud run services describe prisma-todolist-service \
            --region=${{ secrets.GCP_REGION }} \
            --format="value(status.url)"